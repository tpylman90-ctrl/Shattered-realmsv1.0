name: Build and validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Godot and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools .build
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o .tools/godot.zip
          unzip -q .tools/godot.zip -d .tools
          chmod +x .tools/Godot_v4.5.2-stable_linux.x86_64
          echo "$PWD/.tools" >> "$GITHUB_PATH"
          ln -s Godot_v4.5.2-stable_linux.x86_64 .tools/godot
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz -o .tools/templates.zip
          unzip -q .tools/templates.zip -d .tools/export
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          mv .tools/export/templates/* "$HOME/.local/share/godot/export_templates/4.5.2.stable/"
      - name: Render Ravenwood backdrops
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1
          curl -fL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o .tools/blender.tar.xz
          tar -xf .tools/blender.tar.xz -C .tools
          .tools/blender-4.5.3-linux-x64/blender --background --python-exit-code 1 --python tools/build_ravenwood.py -- --output game/assets/generated/ravenwood
      - name: Install pinned addons
        run: python3 tools/bootstrap.py
      - name: Import and validate scripts
        run: godot --headless --path game --editor --import 2>&1 | tee .build/import.log
      - name: Reject script import errors
        run: "! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' .build/import.log"
      - name: Run gameplay tests
        run: godot --headless --path game -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit
      - name: Configure test signing and SDK paths
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore .tools/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/.tools/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Export APK
        run: godot --headless --path game --export-debug Android ../.build/shattered-realms-debug.apk
      - name: Validate APK
        run: |
          test -s .build/shattered-realms-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify .build/shattered-realms-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shattered-realms-debug
          path: .build/shattered-realms-debug.apk
          if-no-files-found: error
          retention-days: 7
