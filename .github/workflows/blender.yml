name: Blender asset check
on:
  push:
    branches: [main]
    paths: ['tools/blender*', '.github/workflows/blender.yml', 'assets/source/**']
  pull_request:
    paths: ['tools/blender*', '.github/workflows/blender.yml', 'assets/source/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender LTS
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1
          mkdir -p .tools
          curl -fL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o .tools/blender.tar.xz
          tar -xf .tools/blender.tar.xz -C .tools
      - name: Verify NumPy and render/export fixture
        run: .tools/blender-4.5.3-linux-x64/blender --background --python-exit-code 1 --python tools/blender_calibration.py -- --output .build/calibration
      - uses: actions/upload-artifact@v4
        with:
          name: blender-calibration
          path: .build/calibration/
          if-no-files-found: error
          retention-days: 7
