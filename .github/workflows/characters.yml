name: Character authoring check
on:
  push:
    branches: [main]
    paths: ['tools/characters/**', 'art/characters/**', '.github/workflows/characters.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  characters:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check optional authoring source
        id: source
        run: |
          if [ -f art/characters/neutral-starters.blend ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Editable Blender source is stored separately; validating committed runtime exports."
          fi
      - name: Install Blender 4.5.3 LTS
        if: steps.source.outputs.available == 'true'
        run: |
          mkdir -p .tools
          curl -fL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o .tools/blender.tar.xz
          tar -xf .tools/blender.tar.xz -C .tools
      - name: Install pinned MPFB
        if: steps.source.outputs.available == 'true'
        run: python3 tools/characters/bootstrap.py
      - name: Fit native MPFB rigs to approved art and bake locomotion
        if: steps.source.outputs.available == 'true'
        run: .tools/blender-4.5.3-linux-x64/blender -b -t 4 --python-exit-code 1 --python tools/characters/rig_starters.py
      - name: Verify portable exports
        run: python3 tools/characters/validate_exports.py
      - uses: actions/upload-artifact@v4
        with:
          name: starter-character-authoring
          path: |
            .build/characters/*-rigged.blend
            .build/characters/rig-validation.json
            game/assets/characters/*.glb
          retention-days: 7
