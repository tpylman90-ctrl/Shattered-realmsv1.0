name: Material Maker source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/material-maker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authoring-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch pinned open-source authoring tool
        run: |
          git clone --depth 1 --branch 1.4 https://github.com/RodZill4/material-maker.git material-maker
          rm -rf material-maker/.git
      - uses: actions/upload-artifact@v4
        with:
          name: material-maker-1.4-source
          path: material-maker/
          retention-days: 7
